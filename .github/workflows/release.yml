name: Release

on:
  push:
    branches: [ master ]
    paths: [ Cargo.toml ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install latest stable
      uses: dtolnay/rust-toolchain@stable
    - name: Check for unreleased version
      id: version
      run: |
        version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
          echo "v$version is already released"
        else
          echo "new=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Authenticate with crates.io
      if: steps.version.outputs.new
      id: auth
      uses: rust-lang/crates-io-auth-action@v1
    - name: Publish to crates.io
      if: steps.version.outputs.new
      run: cargo publish --token ${{ steps.auth.outputs.token }}
    - name: Create GitHub release
      if: steps.version.outputs.new
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.version.outputs.version }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
