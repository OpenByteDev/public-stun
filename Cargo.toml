[package]
name = "public-stun"
version = "0.1.1"
edition = "2024"
description = "A list of public STUN servers in crate form."
repository = "https://github.com/OpenByteDev/public-stun" 
homepage = "https://github.com/OpenByteDev/public-stun"
documentation = "https://docs.rs/public-stun"
license = "MIT"
authors = ["OpenByte <development.openbyte@gmail.com>"]
categories = ["network-programming"]
keywords = ["stun", "nat", "public", "networking"]

[dependencies]
enumflags2 = { version = "0.7", default-features = false }
thiserror = { version = "2.0", default-features = false }
const_format = { version = "0.2", default-features = false, optional = true }
reqwest = { version = "0.13", features = ["default-tls"], default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.49", features = ["rt", "macros"], default-features = false }

[features]
default = ["packaged"]
packaged = []
fetched = ["dep:reqwest", "dep:const_format"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
